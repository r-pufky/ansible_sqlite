---
###############################################################################
# Default
###############################################################################
# Verify sqlite is installed, a dirty db is cleaned, and a query against a db
# successfully returns results.
#
# Tests:
# * SQLite packages are installed.
# * Dirty DB's are cleaned.
# * Query sucessfully returns results.

dependency:
  name: 'galaxy'
driver:
  name: 'podman'
provisioner:
  name: 'ansible'
  config_options:
    defaults:
      interpreter_python: 'auto_silent'
      callback_whitelist: 'profile_tasks, timer, yaml'
    ssh_connection:
      pipelining: false
  inventory:
    group_vars:
      all:
        sqlite_install: true
platforms:
  - name: 'sqlite-debian-12-default'
    image: 'ghcr.io/hifis-net/debian-systemd:12'
    systemd: 'always'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:ro'
    command: '/lib/systemd/systemd'
    pre_build_image: true
verifier:
  name: 'ansible'
lint: |
  set -e
  yamllint .
  ansible-lint .
scenario:
  test_sequence:
    # - 'dependency'
    # - 'cleanup'
    - 'destroy'
    - 'syntax'
    - 'create'
    - 'prepare'
    - 'converge'
    # - 'idempotence'  # queries are not idempotent.
    # - 'side_effect'
    - 'verify'
    # - 'cleanup'
    - 'destroy'
